<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Ramakrishna Hospital - Forms Section</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CM001 - Body Styles */
body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }

/* CM002 - Animations */
.fade-in { animation: fadeIn 0.5s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* CM003 - Utilities */
.hidden { display: none !important; }

/* CM004 - Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #f1f1f1; }
::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* CM005 - Iframe Container */
.iframe-container { height: calc(100vh - 105px); }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 overflow-hidden bg-gray-100">

<!-- CM006 - Login Section -->
<div id="loginSection" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden fade-in mx-4 relative z-10">
<div class="bg-blue-600 text-white p-6 text-center">
<h1 class="text-2xl font-bold">Sri Ramakrishna Hospital</h1>
<p class="text-blue-100 mt-2 text-sm">Forms Access Portal</p>
</div>
<div class="p-8">
<div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center border border-red-200">Invalid Username or Password.</div>
<form id="loginForm" onsubmit="handleLogin(event)">
<div class="mb-5">
<label for="username" class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
<input type="text" id="username" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="Enter username" required oninput="this.value = this.value.toUpperCase()">
</div>
<div class="mb-6">
<label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
<input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="Enter password" required>
</div>
<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Sign In</button>
</form>
</div>
<div class="bg-gray-50 p-4 text-center border-t border-gray-100">
<p class="text-xs text-gray-500">&copy; 2026 Sri Ramakrishna Hospital. All rights reserved.</p>
</div>
</div>

<!-- CM007 - Dashboard Section (Fixed Full Screen) -->
<div id="dashboardSection" class="hidden fixed inset-0 w-screen h-screen bg-white flex flex-col overflow-hidden fade-in z-50">

<!-- CM008 - Dashboard Header -->
<header class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10 flex-shrink-0 w-full">
<div class="flex items-center gap-3">
<img src="https://rh-alg.github.io/RH-IMG/RH-LOGO.png" alt="SRH Logo" class="h-10 md:h-12 w-auto bg-white rounded-md p-1 object-contain shadow-sm">
<div>
<h1 class="text-xl md:text-2xl font-bold tracking-tight">Sri Ramakrishna Hospital</h1>
<h2 class="text-sm text-blue-100 mt-1 font-medium flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Forms Section</h2>
</div>
</div>
<button onclick="handleLogout()" class="bg-white/20 hover:bg-white/30 text-white border border-white/50 py-1.5 px-4 rounded-full text-sm font-semibold transition-all duration-200 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg><span>Logout</span></button>
</header>

<!-- CM009 - Dashboard Nav -->
<nav class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0 w-full">
<div class="flex overflow-x-auto py-2 px-2 space-x-2 custom-scrollbar items-center w-full" id="formNavContainer"></div>
</nav>

<!-- CM010 - Dashboard Main -->
<main class="flex-grow bg-gray-100 relative iframe-container w-full h-full">
<div id="iframeLoader" class="absolute inset-0 flex items-center justify-center bg-gray-100 z-0">
<div class="flex flex-col items-center text-gray-500">
<svg class="animate-spin h-8 w-8 mb-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
<span class="text-sm font-medium">Loading Form...</span>
</div>
</div>
<iframe id="formFrame" name="formFrame" class="relative z-10 bg-white w-full h-full" title="Form Document Viewer" onload="hideLoader()"></iframe>
</main>
</div>

<!-- CM011 - Scripts Logic -->
<script>
// CM012 - DOM Elements
const loginSection = document.getElementById('loginSection'); const dashboardSection = document.getElementById('dashboardSection'); const errorMessage = document.getElementById('errorMessage'); const formFrame = document.getElementById('formFrame'); const iframeLoader = document.getElementById('iframeLoader'); const formNavContainer = document.getElementById('formNavContainer');

// CM013 - Data & Constants
const formsList = [{ name: 'Delivery Record', file: 'delivery.html' }, { name: 'Anaesthesia Consent', file: 'anaesthesiaconsent.html' }, { name: 'Death Record', file: 'death.html' }, { name: 'Discharge Summary', file: 'ds.html' }, { name: 'Fee Details', file: 'fee.html' }, { name: 'High Risk Consent', file: 'highriskconsent.html' }, { name: 'Inpatient Bill', file: 'ipbill.html' }, { name: 'Payment Declaration', file: 'paymentdeclare.html' }, { name: 'Sterilization Form', file: 'sterilization.html' }, { name: 'Surgical Consent', file: 'surgicalconsent.HTML' }];
const VALID_USER = 'RH01'; const VALID_PASS = '1111'; const BASE_URL = 'https://rh-alg.github.io/WEB-V1.0/forms/';

// CM014 - Initialization
document.addEventListener('DOMContentLoaded', () => { renderNavButtons(); if (localStorage.getItem('srh_logged_in') === 'true') { showDashboard(); } });

// CM015 - UI Render Logic
function renderNavButtons() { formNavContainer.innerHTML = ''; formsList.forEach((form, index) => { const btn = document.createElement('button'); btn.className = `whitespace-nowrap px-4 py-2 text-sm font-medium rounded-lg transition-colors duration-200 flex-shrink-0 border ${index === 0 ? 'bg-blue-50 text-blue-700 border-blue-200 shadow-sm' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:text-gray-900'}`; btn.textContent = form.name; btn.onclick = () => loadForm(form.file, btn); formNavContainer.appendChild(btn); }); }

// CM016 - Form Load Logic
function loadForm(filename, clickedBtn) { iframeLoader.style.display = 'flex'; formFrame.src = BASE_URL + filename; const buttons = formNavContainer.querySelectorAll('button'); buttons.forEach(b => b.className = 'whitespace-nowrap px-4 py-2 text-sm font-medium rounded-lg transition-colors duration-200 flex-shrink-0 border bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:text-gray-900'); if (clickedBtn) { clickedBtn.className = 'whitespace-nowrap px-4 py-2 text-sm font-medium rounded-lg transition-colors duration-200 flex-shrink-0 border bg-blue-50 text-blue-700 border-blue-200 shadow-sm'; clickedBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } }

// CM017 - Utility Functions
function hideLoader() { iframeLoader.style.display = 'none'; }

// CM018 - Auth Logic
function handleLogin(event) { event.preventDefault(); if (document.getElementById('username').value.trim() === VALID_USER && document.getElementById('password').value.trim() === VALID_PASS) { errorMessage.classList.add('hidden'); localStorage.setItem('srh_logged_in', 'true'); showDashboard(); } else { errorMessage.classList.remove('hidden'); loginSection.classList.add('animate-shake'); setTimeout(() => loginSection.classList.remove('animate-shake'), 500); } }
function handleLogout() { localStorage.removeItem('srh_logged_in'); document.getElementById('username').value = ''; document.getElementById('password').value = ''; showLogin(); }

// CM019 - View Transitions
function showDashboard() { loginSection.classList.add('hidden'); dashboardSection.classList.remove('hidden'); if (!formFrame.src || formFrame.src === window.location.href || formFrame.src === 'about:blank') { loadForm(formsList[0].file, formNavContainer.querySelector('button')); } }
function showLogin() { dashboardSection.classList.add('hidden'); loginSection.classList.remove('hidden'); formFrame.src = 'about:blank'; }

// CM020 - Dynamic Styles
const style = document.createElement('style'); style.innerHTML = `@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } } .animate-shake { animation: shake 0.4s ease-in-out; }`; document.head.appendChild(style);
</script>
</body>
</html>
